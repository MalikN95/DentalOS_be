name: dentalos

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentalos
      POSTGRES_PASSWORD: dentalos
      POSTGRES_DB: dentalos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dentalos -d dentalos']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dentalos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API (matches S3_ENDPOINT)
      - '9001:9001' # Web console → http://localhost:9001
    volumes:
      - minio_data:/data

  # Creates the bucket on startup; retries until MinIO is reachable, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: dentalos-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/dentalos;
      echo 'bucket \"dentalos\" is ready';
      "

volumes:
  postgres_data:
  minio_data:
