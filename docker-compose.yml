name: dentalos

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentalos
      POSTGRES_PASSWORD: dentalos
      POSTGRES_DB: dentalos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dentalos -d dentalos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
